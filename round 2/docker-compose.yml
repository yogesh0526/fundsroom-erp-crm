version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_round2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: erp_round2
    ports:
      - "5432:5432"
    volumes:
      - pgdata_round2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_round2_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:root@postgres:5432/erp_round2?schema=public
      JWT_SECRET: super-secret-jwt-key-wholesale-erp-crm-2026-industrial-supply
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp_round2_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata_round2:
